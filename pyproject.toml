[project]
name = "sbx"
version = "0.1.0"
description = "Прогнозирование потребительских расходов МО и раннее обнаружение структурных сдвигов (конкурс СберИндекс 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "pyyaml>=6",
    "typer>=0.12",
    "scikit-learn>=1.5",
    "certifi>=2026.7.22",
    "tabulate>=0.10.0",
    "fpdf2>=2.8.8",
    "pytorch-lightning>=2.6.6",
]

[project.optional-dependencies]
ml = [
    "statsforecast>=2.0",
    "prophet>=1.1.6",
    "lightgbm>=4.5",
    "neuralforecast>=3.0",
    "chronos-forecasting>=2.0",
    "timesfm>=1.3",
    "ruptures>=1.1.9",
    "river>=0.22",
    "optuna>=4.0",
]
report = [
    "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/stasvinokur/konkurs_sberindex_2026"

[project.scripts]
sbx = "sbx.shell.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbx"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: долгие интеграционные тесты (тяжёлые модели, полные данные)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP047"]
