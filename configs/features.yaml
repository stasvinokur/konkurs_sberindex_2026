# Лаги публикации внешних источников.
#
# Признак месяца M попадает в модель только после того, как источник его опубликовал.
# Лаг задаётся в днях от конца отчётного периода. Механизм сдвига — `core/features/asof.py`,
# проверка — `tests/test_leakage.py`.
#
# Почему лаги разные: недельные ряды — это опережающие индикаторы, вся их ценность в том, что
# они выходят быстро. Если применить к ним общий месячный лаг в 35 дней, преимущество
# теряется, и признак описывает уже прошедший режим.

publication_lag_days:
  # Месячные ряды СберИндекса: данные месяца M выходят примерно через пять недель после его
  # конца, то есть в первой декаде M+2. Консервативно берём 35 дней.
  consumer-spending: 35
  consumer-spending-growth: 35
  consumper-spending-index-sa: 35
  potrebitelskaya-aktivnost-po-kategoriyam-tovarov-v-razreze-vozrastov: 35

  # Показатели, опирающиеся на отчётность работодателей и Росстат, выходят позже месячных
  # расходов: зарплаты и фонд оплаты труда — примерно через два месяца.
  median-wages: 60
  oboroty-biznesa: 45
  izmenenie-obema-fot: 60

  # Ключевая ставка известна в день решения совета директоров Банка России, но ряд
  # «реальная ключевая ставка» строится с использованием инфляции, поэтому берём лаг
  # недельной инфляции, а не ноль.
  real-key-interest-rate: 7

  # Недельные ряды: Росстат публикует недельную инфляцию в среду за неделю, закончившуюся
  # в понедельник; недельные траты СберИндекса выходят с похожей задержкой.
  nedelnaa-inflazia-v-razreze-analiticeskih-komponentov: 7
  ver-izmenenie-trat-po-kategoriyam: 7

  # Погода NASA POWER: оперативные значения выходят через несколько дней после конца суток,
  # так что к концу месяца предыдущий месяц известен целиком. Скачаны окончательные значения
  # реанализа MERRA-2 — они уточняются позже и от оперативных немного отличаются.
  nasa-power-weather: 7

# Значение по умолчанию для источника, не перечисленного выше.
default_lag_days: 35

# Численность населения МО (Росстат). Таблица привязывается к территориям панели по названиям
# через бюллетень следующего года; если привязано меньше этой доли территорий, население в
# прогнозе не используется и остаётся справочным показателем.
population:
  min_match_share: 0.9
