# Бенчмарк обнаружения структурных изменений.
#
# Бенчмарк заморожен файлами `frozen_benchmark` (…_series.parquet, …_labels.parquet): те же
# ряды и те же внесённые сломы, что в опубликованном расчёте, с исходными рядами в официальных
# кодах. n_series, deltas, control_share и seed — параметры, с которыми он был собран; их
# проверяет `uv run sbx data freeze-samples --check`. Без `frozen_benchmark` бенчмарк
# собирается заново на текущей панели.
frozen_benchmark: data/benchmark/cpd_benchmark_v1
n_series: 1500
deltas: [0.05, 0.1, 0.2, 0.4]
control_share: 0.25
seed: 20260916
split_seed: 1
margin: 1          # окно допуска при сопоставлении точек, месяцев
# Эксплуатационный контур: поток остатков ансамбля строится только из прогнозов на ближайшие
# месяцы. Фолды h=6 и h=12 нужны для оценки точности, а их ранние месяцы предсказаны по 10–11
# месяцам обучения — такие промахи детектор принял бы за сдвиги.
live_max_horizon: 3

# Офлайн-методы получают ряд в единицах собственного шума (`core/changepoint/offline.py`),
# поэтому штраф квадратичной стоимости — это число дисперсий шума, которыми должен окупиться
# разрез, одинаковое для рядов любого уровня. Слом допускается в любом месяце.
offline_methods: [pelt_l2, pelt_rbf, binseg_l2, window_l2, kernel_rbf]
penalty_grid: [0.5, 1, 3, 10, 30, 100, 300, 1000]

# Эталон сравнения — тревога по расписанию, не глядя на данные: каждые N месяцев. Период
# подбирается по F1 на калибровочной части, как параметры методов.
baseline_periods: [2, 3, 4, 5, 6, 8, 12]

online_detectors: [cusum, page_hinkley, bocpd, adwin, conformal]
threshold_grids:
  cusum: [2, 3, 5, 8, 12]
  page_hinkley: [3, 5, 8, 12, 20]
  bocpd: [0.15, 0.25, 0.35, 0.5]
  adwin: [0.05, 0.01, 0.002, 0.0005]
  conformal: [1.5, 2.0, 2.5, 3.0]
