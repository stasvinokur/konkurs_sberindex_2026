# Календарь реальных шоков потребительских расходов для проверки CPD-методов.
#
# Это НЕ ground truth того же качества, что полусинтетический бенчмарк. Разметка реальных
# шоков неизбежно субъективна: известна дата события, но не известно, в каком именно месяце
# ряд «сломался» и сломался ли вообще. Поэтому:
#   * окно допуска здесь шире, чем на синтетике (±2 месяца против ±1);
#   * события отобраны только те, где ожидаемый эффект на расходы очевиден и велик;
#   * у каждого события указан проверяемый официальный источник;
#   * результат используется как проверка на вменяемость, а не как основная метрика.
#
# Поле expect: ожидаемое направление эффекта на расходы (drop / spike / regime).
# Поле series: к каким рядам событие применимо (monthly — consumer-spending с 2018-12,
# weekly — ver-izmenenie-trat-po-kategoriyam с 2023-11).

margin_months: 2
margin_weeks: 3

events:
  - date: 2020-03-01
    name: "Начало пандемии COVID-19: ажиотажный спрос"
    expect: spike
    series: [monthly]
    description: >-
      Во второй половине марта 2020 года закупки впрок перед объявлением нерабочих дней
      дали резкий всплеск расходов на продовольствие и товары первой необходимости.
    source: http://www.kremlin.ru/acts/bank/45335
    source_name: "Указ Президента РФ от 25.03.2020 № 206 «Об объявлении в Российской Федерации нерабочих дней»"

  - date: 2020-04-01
    name: "Нерабочие дни и ограничения COVID-19"
    expect: drop
    series: [monthly]
    description: >-
      Нерабочие дни с 30 марта, закрытие непродовольственной розницы, общепита и услуг.
      Самый глубокий провал потребительских расходов за всю историю ряда.
    source: http://www.kremlin.ru/acts/bank/45335
    source_name: "Указ Президента РФ от 25.03.2020 № 206"

  - date: 2022-03-01
    name: "Ключевая ставка 20% и ажиотажный спрос"
    expect: spike
    series: [monthly]
    description: >-
      28 февраля 2022 года Банк России повысил ключевую ставку с 9,5% до 20% годовых.
      В марте — ажиотажные покупки товаров длительного пользования, затем спад.
    source: https://www.cbr.ru/hd_base/KeyRate/
    source_name: "База данных Банка России по ключевой ставке"

  - date: 2022-09-01
    name: "Частичная мобилизация"
    expect: regime
    series: [monthly]
    description: >-
      Объявление частичной мобилизации 21 сентября 2022 года: сжатие спроса на товары
      длительного пользования и услуги, рост доли обязательных расходов.
    source: http://www.kremlin.ru/acts/bank/48308
    source_name: "Указ Президента РФ от 21.09.2022 № 647 «Об объявлении частичной мобилизации в Российской Федерации»"

  - date: 2024-10-01
    name: "Ключевая ставка 21%"
    expect: regime
    series: [monthly, weekly]
    description: >-
      25 октября 2024 года ключевая ставка повышена до 21% годовых — исторического
      максимума. Ожидаемый эффект: торможение расходов в кредитоёмких категориях.
    source: https://www.cbr.ru/hd_base/KeyRate/
    source_name: "База данных Банка России по ключевой ставке"
