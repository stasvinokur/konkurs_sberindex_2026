# Курируемый календарь событий, влияющих на потребление.
#
# Поля: date — начало события; published_at — когда о событии стало известно (для point-in-time);
# region_code — код субъекта по нашему справочнику (`all` — вся страна); kind — тип события;
# source — проверяемый источник.
#
# События GDELT шумные и не всегда экономически значимые, поэтому ключевые решения и ЧС
# перечислены явно: это повышает интерпретируемость разборов и даёт модели «чистые» признаки.

