# Курируемые данные для однозначной идентификации МО.
reference:
  filter_order: data/reference/mo_filter_order.txt   # публичный список фильтра «Муниципалитет» на sberindex.ru (2026-09-16)
  oktmo: data/reference/wikidata_oktmo_municipal.csv  # Wikidata P764, коды ОКТМО муниципального уровня (2026-09-16)

# Названия, которые не разрешаются по справочнику и порядку списка (в «хвосте» списка фильтра).
region_overrides:
  - name: "городской округ Пушкинский"
    region_code: "46"
    source: "Wikidata Q1773432 — Pushkinsky Urban District, urban okrug in Moscow Oblast"
  - name: "городской округ город Губкинский"
    region_code: "719"
    source: "Губкинский — город окружного значения Ямало-Ненецкого АО; в Белгородской области — «Губкинский городской округ» без слова «город»"
  - name: "городской округ город Березники"
    region_code: "57"
    source: "Березники — город краевого подчинения Пермского края"
  - name: "городской округ Павловский Посад"
    region_code: "46"
    source: "Павловский Посад — Московская область; преемник — Павлово-Посадский городской округ (Wikidata Q2627343, ОКТМО 46759000)"

# Реорганизации МО, видимые в данных как переход рядов между названиями.
# continuation — один territory_id с административным разрывом; merge — влитие без склейки рядов.
reorganizations:
  - successor: "городской округ Павлово-Посадский"
    predecessor: "городской округ Павловский Посад"
    relation: continuation
    effective: "2024-03-01"
    source: "Wikidata Q2627343 (Павлово-Посадский городской округ, ОКТМО 46759000, образован 2023-01-09); в данных СберИндекса ряд предшественника заканчивается 2023-12, преемника начинается 2024-03"
  - successor: "городской округ Павлово-Посадский"
    predecessor: "городской округ Электрогорск"
    relation: merge
    effective: "2024-03-01"
    source: "Электрогорск объединён с Павловским Посадом в Павлово-Посадский городской округ (Wikidata Q2627343); ряд Электрогорска заканчивается 2023-12"
  - successor: "Сасовский муниципальный округ"
    predecessor: "городской округ город Сасово"
    relation: continuation
    effective: "2024-03-01"
    source: "Объединение города Сасово и Сасовского района в Сасовский муниципальный округ (Рязанская область); в данных ряд города заканчивается 2023-12, округа начинается 2024-03"
