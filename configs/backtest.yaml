# Протокол оценки прогнозов.
#
# Статус: приведён в соответствие с критериями конкурса после проверки страницы 2026-09-29.
# Критерий 2 (20%) требует явно: «...а также ещё четыре горизонта прогнозирования (1, 3, 6, 12 мес)».
# Базовая модель организаторов по-прежнему не опубликована; эталон сравнения — Prophet,
# как он назван в самом критерии.
status: aligned-with-criteria
checked_at: "2026-09-29"
target:
  dataset: potrebitelskie-beznalicnye-rashody-na-urovne-munizipalnyh-obrazovanij
  freq: MS
  level: territory_id x category

# Отдельный фолд на пару (горизонт, origin). Горизонт задан явно, а не выведен из origin:
# для direct-моделей он меняет обучающую выборку, поэтому «2023-12, h=3» и «2023-12, h=12» —
# разные эксперименты. Панель: 2023-01 … 2024-12 (24 месяца), поэтому чем длиннее горизонт,
# тем меньше origin-ов помещается.
folds:
  - horizon: 1
    origins: ["2023-12-01", "2024-03-01", "2024-06-01", "2024-09-01"]
  - horizon: 3
    origins: ["2023-12-01", "2024-03-01", "2024-06-01", "2024-09-01"]
  - horizon: 6
    origins: ["2023-12-01", "2024-03-01", "2024-06-01"]
  # h=12 упирается в длину панели: тест на 12 месяцев вперёд возможен только от origin
  # не позже 2023-12. Три окна сильно перекрываются (10–11 общих месяцев из 12) и НЕ являются
  # тремя независимыми наблюдениями — это оговорено в отчёте.
  - horizon: 12
    origins: ["2023-10-01", "2023-11-01", "2023-12-01"]

primary_metric: mae
mae_aggregation: micro
reference_baselines: [prophet, seasonal_naive]
assumptions:
  - "Горизонты 1, 3, 6, 12 заданы критерием 2 конкурса (проверено на странице 2026-09-29)."
  - "Базовая модель организаторов не опубликована; эталон из критериев — Prophet."
  - "Уровень оценки — ряд «территория × категория» из исходного датасета, значения в рублях."
  - "MAE: основная агрегация — micro по всем (ряд, месяц прогноза); дополнительно по горизонтам."
  - "R² считается per-series (медиана) и pooled."
  - "Модели сравниваются на общих наблюдениях ВНУТРИ каждого горизонта: при h=12 часть моделей неопределима."
min_train_obs: 6
quantiles: [0.1, 0.5, 0.9]
metric_slices: [category, size_group, step, fold, horizon]
