# Погода NASA POWER: месячные значения реанализа MERRA-2 по ячейкам сетки.
#
# Запрос — один на ячейку сетки, в которую попадает центр МО. Докачка: `sbx data weather`
# (ответы — в data/external/weather, вне git); таблица для расчёта лежит в репозитории
# (data/reference/weather/power_monthly.parquet) и сверяется с data/weather_manifest.yaml.

api: https://power.larc.nasa.gov/api/temporal/monthly/point
community: AG
# Температура воздуха на высоте 2 м, °C; осадки с поправкой, мм в день.
parameters: [T2M, PRECTOTCORR]
start_year: 2001
end_year: 2024

# Норма — среднее календарного месяца за годы до начала панели. Признаком служит отклонение
# от нормы своей ячейки, поэтому норма не должна включать месяцы, которые прогнозируются.
norm_years: [2001, 2020]

# В репозитории хранятся месяцы с запасом перед началом панели (январь 2023): «погода за три
# последних опубликованных месяца» для первых месяцев панели смотрит в конец 2022 года.
keep_from: "2022-01-01"

# У внутригородских территорий Санкт-Петербурга (код региона 40) и Москвы (45) в справочнике
# нет координат центра: берётся центр города — широта, долгота.
city_centers:
  "40": [59.9386, 30.3141]
  "45": [55.7558, 37.6173]
